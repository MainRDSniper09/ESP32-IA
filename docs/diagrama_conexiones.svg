<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Arial, sans-serif" font-size="14">
  <rect width="900" height="640" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2933">Diagrama de conexiones — Asistente de voz ESP32-S3</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#52606d">Cada LED: GPIO → resistencia de 220 Ω → pata larga del LED · pata corta → GND</text>

  <!-- Placa -->
  <rect x="60" y="80" width="200" height="500" rx="12" fill="#1f3b57" stroke="#0f2233" stroke-width="2"/>
  <text x="160" y="115" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">ESP32-S3</text>
  <text x="160" y="135" text-anchor="middle" fill="#c9d6e3" font-size="12">DevKitC-1</text>

  <!-- Riel GND -->
  <line x1="820" y1="150" x2="820" y2="600" stroke="#000" stroke-width="3"/>
  <text x="820" y="142" text-anchor="middle" font-weight="bold">GND</text>
  <text x="160" y="560" text-anchor="middle" fill="#fff" font-weight="bold">GND</text>
  <line x1="160" y1="580" x2="160" y2="600" stroke="#000" stroke-width="3"/>
  <line x1="160" y1="600" x2="820" y2="600" stroke="#000" stroke-width="3"/>

  <!-- Encabezados de columnas -->
  <text x="330" y="150" text-anchor="middle" font-size="12" fill="#52606d">pin</text>
  <text x="440" y="150" text-anchor="middle" font-size="12" fill="#52606d">resistencia</text>
  <text x="575" y="150" text-anchor="middle" font-size="12" fill="#52606d">LED</text>
  <text x="700" y="150" text-anchor="middle" font-size="12" fill="#52606d">representa</text>

  <g stroke-width="2">
    <g transform="translate(0,180)">
      <text x="250" y="5" text-anchor="end" fill="#fff">GPIO 4</text>
      <line x1="260" y1="0" x2="415" y2="0" stroke="#333"/>
      <rect x="415" y="-8" width="50" height="16" fill="#e9d8a6" stroke="#333"/><text x="440" y="-12" text-anchor="middle" font-size="11">220 Ω</text>
      <line x1="465" y1="0" x2="560" y2="0" stroke="#333"/>
      <polygon points="560,-12 560,12 584,0" fill="#ffd400" stroke="#333"/><line x1="586" y1="-12" x2="586" y2="12" stroke="#333"/>
      <line x1="586" y1="0" x2="820" y2="0" stroke="#333"/>
      <text x="700" y="-7" text-anchor="middle" font-size="13">Recepción</text>
    </g>
    <g transform="translate(0,230)">
      <text x="250" y="5" text-anchor="end" fill="#fff">GPIO 5</text>
      <line x1="260" y1="0" x2="415" y2="0" stroke="#333"/>
      <rect x="415" y="-8" width="50" height="16" fill="#e9d8a6" stroke="#333"/><text x="440" y="-12" text-anchor="middle" font-size="11">220 Ω</text>
      <line x1="465" y1="0" x2="560" y2="0" stroke="#333"/>
      <polygon points="560,-12 560,12 584,0" fill="#ffd400" stroke="#333"/><line x1="586" y1="-12" x2="586" y2="12" stroke="#333"/>
      <line x1="586" y1="0" x2="820" y2="0" stroke="#333"/>
      <text x="700" y="-7" text-anchor="middle" font-size="13">Oficina</text>
    </g>
    <g transform="translate(0,280)">
      <text x="250" y="5" text-anchor="end" fill="#fff">GPIO 6</text>
      <line x1="260" y1="0" x2="415" y2="0" stroke="#333"/>
      <rect x="415" y="-8" width="50" height="16" fill="#e9d8a6" stroke="#333"/><text x="440" y="-12" text-anchor="middle" font-size="11">220 Ω</text>
      <line x1="465" y1="0" x2="560" y2="0" stroke="#333"/>
      <polygon points="560,-12 560,12 584,0" fill="#ffd400" stroke="#333"/><line x1="586" y1="-12" x2="586" y2="12" stroke="#333"/>
      <line x1="586" y1="0" x2="820" y2="0" stroke="#333"/>
      <text x="700" y="-7" text-anchor="middle" font-size="13">Sala de juntas</text>
    </g>
    <g transform="translate(0,330)">
      <text x="250" y="5" text-anchor="end" fill="#fff">GPIO 7</text>
      <line x1="260" y1="0" x2="415" y2="0" stroke="#333"/>
      <rect x="415" y="-8" width="50" height="16" fill="#e9d8a6" stroke="#333"/><text x="440" y="-12" text-anchor="middle" font-size="11">220 Ω</text>
      <line x1="465" y1="0" x2="560" y2="0" stroke="#333"/>
      <polygon points="560,-12 560,12 584,0" fill="#ffd400" stroke="#333"/><line x1="586" y1="-12" x2="586" y2="12" stroke="#333"/>
      <line x1="586" y1="0" x2="820" y2="0" stroke="#333"/>
      <text x="700" y="-7" text-anchor="middle" font-size="13">Cocina</text>
    </g>
    <g transform="translate(0,380)">
      <text x="250" y="5" text-anchor="end" fill="#fff">GPIO 15</text>
      <line x1="260" y1="0" x2="415" y2="0" stroke="#333"/>
      <rect x="415" y="-8" width="50" height="16" fill="#e9d8a6" stroke="#333"/><text x="440" y="-12" text-anchor="middle" font-size="11">220 Ω</text>
      <line x1="465" y1="0" x2="560" y2="0" stroke="#333"/>
      <polygon points="560,-12 560,12 584,0" fill="#ffd400" stroke="#333"/><line x1="586" y1="-12" x2="586" y2="12" stroke="#333"/>
      <line x1="586" y1="0" x2="820" y2="0" stroke="#333"/>
      <text x="700" y="-7" text-anchor="middle" font-size="13">Baño</text>
    </g>
    <g transform="translate(0,430)">
      <text x="250" y="5" text-anchor="end" fill="#fff">GPIO 16</text>
      <line x1="260" y1="0" x2="415" y2="0" stroke="#333"/>
      <rect x="415" y="-8" width="50" height="16" fill="#e9d8a6" stroke="#333"/><text x="440" y="-12" text-anchor="middle" font-size="11">220 Ω</text>
      <line x1="465" y1="0" x2="560" y2="0" stroke="#333"/>
      <polygon points="560,-12 560,12 584,0" fill="#ffd400" stroke="#333"/><line x1="586" y1="-12" x2="586" y2="12" stroke="#333"/>
      <line x1="586" y1="0" x2="820" y2="0" stroke="#333"/>
      <text x="700" y="-7" text-anchor="middle" font-size="13">Bodega</text>
    </g>
    <g transform="translate(0,490)">
      <text x="250" y="5" text-anchor="end" fill="#fff">GPIO 17</text>
      <line x1="260" y1="0" x2="415" y2="0" stroke="#333"/>
      <rect x="415" y="-8" width="50" height="16" fill="#e9d8a6" stroke="#333"/><text x="440" y="-12" text-anchor="middle" font-size="11">220 Ω</text>
      <line x1="465" y1="0" x2="560" y2="0" stroke="#333"/>
      <polygon points="560,-12 560,12 584,0" fill="#22c55e" stroke="#333"/><line x1="586" y1="-12" x2="586" y2="12" stroke="#333"/>
      <line x1="586" y1="0" x2="820" y2="0" stroke="#333"/>
      <text x="700" y="-7" text-anchor="middle" font-size="13">VERDE: entendido</text>
    </g>
    <g transform="translate(0,540)">
      <text x="250" y="5" text-anchor="end" fill="#fff">GPIO 18</text>
      <line x1="260" y1="0" x2="415" y2="0" stroke="#333"/>
      <rect x="415" y="-8" width="50" height="16" fill="#e9d8a6" stroke="#333"/><text x="440" y="-12" text-anchor="middle" font-size="11">220 Ω</text>
      <line x1="465" y1="0" x2="560" y2="0" stroke="#333"/>
      <polygon points="560,-12 560,12 584,0" fill="#ef4444" stroke="#333"/><line x1="586" y1="-12" x2="586" y2="12" stroke="#333"/>
      <line x1="586" y1="0" x2="820" y2="0" stroke="#333"/>
      <text x="700" y="-7" text-anchor="middle" font-size="13">ROJO: no entendí</text>
    </g>
  </g>

  <rect x="60" y="610" width="780" height="24" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="72" y="627" font-size="12" fill="#1f2933">Amarillo = luz de cada habitación · Todos los cátodos (patas cortas) van al mismo GND de la placa</text>
</svg>
