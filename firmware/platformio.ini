; =============================================================================
;  Agente ESP32-S3 — configuración de PlatformIO
;
;  Compilar y grabar:   pio run -e esp32s3 -t upload
;  Monitor serie:       pio device monitor
;  Pruebas en el PC:    pio test -e native        (requiere gcc/g++ instalado)
;
;  El código fuente vive en AgenteESP32/ para que la misma carpeta pueda
;  abrirse directamente con el Arduino IDE (AgenteESP32/AgenteESP32.ino).
; =============================================================================

[platformio]
src_dir = AgenteESP32
default_envs = esp32s3

[env]
lib_deps =
    bblanchon/ArduinoJson@^7.2.1

; ----------------------------------------------------------------- ESP32-S3
[env:esp32s3]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
; 3 MB para la aplicación (Wi-Fi + TLS + servidor web). Conserva la partición NVS.
board_build.partitions = huge_app.csv
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Wall

; ------------------------------------------------- Pruebas unitarias en el PC
; Compila SOLO el núcleo (src/core), que no depende de Arduino ni del ESP32.
[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<src/core/>
; C++11 a propósito: es el estándar del core Arduino-ESP32 2.x.
build_flags =
    -std=gnu++11
    -I AgenteESP32/src
    -Wall
