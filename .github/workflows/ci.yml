name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: Compilar firmware (ESP32-S3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - name: Compilar
        working-directory: firmware
        run: pio run -e esp32s3
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3
          path: |
            firmware/.pio/build/esp32s3/firmware.bin
            firmware/.pio/build/esp32s3/bootloader.bin
            firmware/.pio/build/esp32s3/partitions.bin

  tests:
    name: Pruebas unitarias del núcleo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-native-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - name: pio test -e native
        working-directory: firmware
        run: pio test -e native

  tooling:
    name: Interfaz web, ejemplos y secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: WebPage.h actualizado
        run: python tools/build_web.py --check
      - name: Ejemplos contra el JSON Schema
        run: |
          pip install jsonschema
          python tools/validate_examples.py
      - name: No hay credenciales en el repositorio
        run: |
          if git ls-files | grep -E '(^|/)agente_secrets\.h$'; then
            echo "::error::agente_secrets.h no debe versionarse"; exit 1
          fi
          if git grep -nE 'sk-ant-[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9]{32,}' -- ':!*.md'; then
            echo "::error::Posible clave de API en el código"; exit 1
          fi
